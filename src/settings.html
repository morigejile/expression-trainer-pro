<!DOCTYPE html>
<html lang="zh-CN" data-theme="graphite" data-layout="coach-rail">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: var(--color-page);
      padding: 40px 32px 32px;
      display: block;
      overflow-y: auto;
      -webkit-app-region: drag;
    }

    .settings-container {
      -webkit-app-region: no-drag;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--color-text);
    }

    h2 { color: #fff; font-size: 16px; margin: 28px 0 8px; }
    .section-hint { color: #888; font-size: 12px; margin-bottom: 12px; }
    .asr-model-list { display: grid; gap: 10px; }
    .asr-model-card { position: relative; padding: 14px; border: 1px solid #3f3f3f; border-radius: 10px; background: #242424; }
    .asr-model-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .asr-model-heading h3 { margin: 0; color: #fff; font-size: 14px; }
    .asr-model-badge { flex: none; color: #aaa; font-size: 11px; }
    .status-installed { color: #69db7c; }
    .status-corrupt, .status-failed, .status-unavailable { color: #ff8787; }
    .status-installing { color: #74c0fc; }
    .asr-model-description, .asr-model-meta, .asr-model-empty { margin: 8px 0 0; color: #999; font-size: 12px; line-height: 1.5; }
    .asr-model-meta { color: #777; }
    .asr-model-card progress { width: 100%; height: 6px; margin-top: 10px; accent-color: #4dabf7; }
    .asr-model-action { margin-top: 10px; padding: 7px 12px; border: 1px solid #555; border-radius: 7px; background: transparent; color: #ddd; cursor: pointer; }
    .asr-model-action:hover:not(:disabled) { border-color: #4dabf7; color: #fff; }
    .asr-model-action:disabled { opacity: 0.5; cursor: default; }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--color-text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      color: var(--color-text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: var(--color-focus);
    }

    .form-group input::placeholder {
      color: var(--color-text-subtle);
    }

    .form-group .hint {
      font-size: 12px;
      color: var(--color-text-subtle);
      margin-top: 4px;
    }

    .conditional {
      display: none;
    }

    .conditional.visible {
      display: block;
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      background: var(--color-accent);
      color: var(--color-accent-contrast);
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.2s;
    }

    .btn-save:hover {
      filter: brightness(1.08);
    }

    .message-container {
      position: relative;
      height: 20px;
      margin-top: 12px;
    }

    .save-success {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--color-success);
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .save-success.show {
      opacity: 1;
    }

    .connection-error {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--color-error);
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      word-break: break-all;
    }

    .connection-error.show {
      opacity: 1;
    }

    .connection-error.success {
      color: var(--color-success);
      opacity: 1;
    }

    .model-presets {
      font-size: 12px;
      color: var(--color-text-subtle);
      margin-top: 4px;
    }

    .btn-save.loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .settings-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .profile-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .profile-toolbar select,
    .profile-toolbar input {
      width: auto;
    }

    .profile-toolbar .settings-actions {
      margin-top: 0;
      gap: 6px;
    }

    .settings-actions .btn-save {
      margin-top: 0;
    }

    .btn-test-connection {
      width: 42%;
      padding: 12px;
      background: transparent;
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-test-connection:hover { color: var(--color-text); border-color: var(--color-focus); }
    .btn-test-connection.loading { opacity: 0.6; pointer-events: none; }

    .settings-section {
      border: 1px solid var(--color-border);
      border-radius: 12px;
      margin-bottom: 24px;
      padding: 18px;
    }

    .settings-section h2 {
      color: var(--color-text);
      font-size: 15px;
      margin-bottom: 14px;
    }

    .appearance-group {
      border: 0;
      margin-bottom: 16px;
      padding: 0;
    }

    .appearance-group:last-of-type { margin-bottom: 0; }

    .appearance-group legend {
      color: var(--color-text-muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .appearance-options {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .appearance-option {
      align-items: center;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      color: var(--color-text-muted);
      cursor: pointer;
      display: flex;
      font-size: 13px;
      gap: 8px;
      padding: 10px;
    }

    .appearance-option:has(input:checked) {
      border-color: var(--color-accent);
      color: var(--color-text);
    }

    .appearance-option input { accent-color: var(--color-accent); }

    .appearance-error {
      color: var(--color-error);
      font-size: 12px;
      min-height: 18px;
      opacity: 0;
      padding-top: 8px;
    }

    .appearance-error.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="settings-container">
    <h1>⚙️ 设置</h1>

    <section class="settings-section" aria-labelledby="appearance-heading">
      <h2 id="appearance-heading">外观</h2>
      <fieldset class="appearance-group">
        <legend>主题</legend>
        <div class="appearance-options">
          <label class="appearance-option"><input type="radio" name="appearance-theme" value="graphite" data-appearance-field="theme" checked>石墨</label>
          <label class="appearance-option"><input type="radio" name="appearance-theme" value="midnight" data-appearance-field="theme">深海</label>
          <label class="appearance-option"><input type="radio" name="appearance-theme" value="paper" data-appearance-field="theme">纸张</label>
          <label class="appearance-option"><input type="radio" name="appearance-theme" value="mist" data-appearance-field="theme">晨雾</label>
        </div>
      </fieldset>
      <fieldset class="appearance-group">
        <legend>布局</legend>
        <div class="appearance-options">
          <label class="appearance-option"><input type="radio" name="appearance-layout" value="coach-rail" data-appearance-field="layout" checked>教练侧栏</label>
          <label class="appearance-option"><input type="radio" name="appearance-layout" value="focus-hud" data-appearance-field="layout">专注 HUD</label>
        </div>
      </fieldset>
      <div id="appearance-error" class="appearance-error" role="status"></div>
    </section>

    <section class="settings-section" aria-labelledby="asr-model-title">
      <h2 id="asr-model-title">语音识别模型</h2>
      <p class="section-hint" id="asr-model-status" aria-live="polite">正在读取模型状态…</p>
      <div class="asr-model-list" id="asr-model-list"></div>
    </section>

    <section class="settings-section" aria-labelledby="ai-heading">
      <h2 id="ai-heading">AI 服务</h2>

    <div class="form-group">
      <label for="llm-profile">配置</label>
      <div class="profile-toolbar">
        <select id="llm-profile"></select>
        <input id="llm-profile-name" maxlength="64" aria-label="配置名称">
        <div class="settings-actions">
          <button id="btn-profile-new" type="button">新建</button>
          <button id="btn-profile-duplicate" type="button">复制</button>
          <button id="btn-profile-delete" type="button">删除</button>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>AI 后端</label>
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek（推荐）</option>
        <option value="ollama">Ollama（本地）</option>
        <option value="custom">自定义 OpenAI 兼容</option>
      </select>
    </div>

    <div class="form-group conditional" id="group-apikey">
      <label>API Key</label>
      <input type="password" id="apikey" placeholder="输入你的 API Key">
      <div class="hint" id="apikey-hint">在 platform.deepseek.com 获取</div>
    </div>

    <div class="form-group">
      <label>模型</label>
      <select id="model">
        <!-- 动态填充 -->
      </select>
      <div class="model-presets" id="model-hint"></div>
    </div>

    <div class="form-group conditional" id="group-ollama">
      <label>Ollama 地址</label>
      <input type="text" id="ollama-url" placeholder="http://localhost:11434">
    </div>

    <div class="form-group conditional" id="group-custom">
      <label>OPENAI 协议 BASE URL</label>
      <input type="text" id="custom-base-url" placeholder="https://api.example.com/v1">
      <div class="hint">请求时会自动追加 /chat/completions</div>
    </div>

    <div class="form-group conditional" id="group-custom-model">
      <label>自定义模型名</label>
      <input type="text" id="custom-model" placeholder="model-name">
    </div>

    <div class="message-container">
      <div class="save-success" id="save-success">✓ 已保存</div>
      <div class="connection-error" id="connection-error"></div>
    </div>
    <div class="settings-actions">
      <button class="btn-test-connection" id="btn-test-connection">测试连接</button>
      <button class="btn-save" id="btn-save">保存设置</button>
    </div>
    </section>
  </div>

  <script src="appearance.js"></script>
  <script>window.Appearance.initializeAppearance();</script>
  <script src="settings.js"></script>
</body>
</html>
